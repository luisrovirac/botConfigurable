# Entorno de PRODUCCION. Uso (desde la raiz del proyecto): sh scripts/deploy.sh
#
# Un solo puerto publicado, y solo en 127.0.0.1: WEB_PORT (Caddy). Cloudflare Tunnel lo expone
# por HTTPS (route: https://<subdominio> -> http://localhost:WEB_PORT).
# Los secretos vienen de .env.production (lo genera scripts/init-env-production.sh).

name: botconfigurable

x-backend: &backend
  build:
    context: ..
    dockerfile: infra/Dockerfile.api
    target: runtime
  image: botconfigurable-api:prod
  env_file:
    - ../.env.production
  environment: &backend-env
    ENVIRONMENT: production
    DATABASE_URL: postgresql+asyncpg://bot_app:${APP_DB_PASSWORD:?falta APP_DB_PASSWORD}@db:5432/botconfigurable
    DATABASE_OWNER_URL: postgresql+asyncpg://botowner:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@db:5432/botconfigurable
    APP_DB_USER: bot_app
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: botowner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: botconfigurable
      APP_DB_USER: bot_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?falta APP_DB_PASSWORD}
      CREATE_TEST_DB: "false"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botowner -d botconfigurable"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # Tarea de una vez en cada despliegue: migraciones y datos iniciales (idempotentes).
  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py --demo"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *backend
    command: ["python", "apps/worker/main.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker.heartbeat') > 60)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
    image: botconfigurable-web:prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8030}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  pg_data:
